name: Deploy App to Lambda

on:
  push:
    branches:
      - uploadLambdadev

env:
  AWS_REGION: "us-east-1"
  REPOSITORY_NAME: "threecsolution/presigneds3lambdarepo"
  WORKLOAD_ROLE: "arn:aws:iam::873769222902:role/3Csolution-avahi-org-github-admin-role"
  LAMBDA_FUNCTION_NAME: "threecsolution-s3presignedurlgenerator-lambda"

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.WORKLOAD_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image for x86_64
        env:
          IMAGE_NAME: "${{ env.REPOSITORY_NAME }}"
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: "latest"
        run: |
          cd ext-3csolotions-s3presignedurl-lambda
          docker buildx build \
            --platform linux/amd64 \
            --build-arg TARGETARCH=amd64 \
            --build-arg TARGETPLATFORM=linux/amd64 \
            --load \
            -t $IMAGE_NAME:latest \
            -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
            .

      - name: Verify Image Architecture
        env:
          IMAGE_NAME: "${{ env.REPOSITORY_NAME }}"
        run: |
          echo "Verifying image architecture..."
          docker inspect $IMAGE_NAME:latest | grep -i architecture
          docker inspect $IMAGE_NAME:latest | grep -i os

      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME: "${{ env.REPOSITORY_NAME }}"
          IMAGE_TAG: "latest"
        run: |
          docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Update Lambda Function with New Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME: "${{ env.REPOSITORY_NAME }}"
          IMAGE_TAG: "latest"
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --image-uri $IMAGE_URI