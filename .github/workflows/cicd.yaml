name: Deploy App to Fargate

on:
  push:
    branches:
      - ai_extraction_dev_2

env:
  REPOSITORY_NAME: "threecsolution/backendfargaterepo"
  WORKLOAD_ROLE: "arn:aws:iam::873769222902:role/3Csolution-avahi-org-github-admin-role"
  AWS_REGION: "us-east-1"

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.WORKLOAD_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        env:
          IMAGE_NAME: "${{ env.REPOSITORY_NAME }}"
        run: |
          cd ext-3csolutions-ai
          docker build -t $IMAGE_NAME .

      - name: Tag Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME: "${{ env.REPOSITORY_NAME }}"
          IMAGE_TAG: "latest"
        run: |
          docker tag $IMAGE_NAME:latest $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME: "${{ env.REPOSITORY_NAME }}"
          IMAGE_TAG: "latest"
        run: |
          docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG