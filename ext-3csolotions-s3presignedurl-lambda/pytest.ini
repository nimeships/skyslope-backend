[pytest]
# Pytest configuration for ext-3csolotions-s3presignedurl-lambda

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70

# Markers
markers =
    unit: Unit tests (isolated, no external dependencies)
    integration: Integration tests (use mocked AWS services)
    e2e: End-to-end tests (require real AWS resources)
    slow: Tests that take more than 1 second
    security: Security-focused tests

# Asyncio mode
asyncio_mode = auto

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
